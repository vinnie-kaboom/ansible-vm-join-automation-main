# ===================================================================================
# VM PROVISIONING PROJECT - Consolidated Inventory Structure
# ===================================================================================
#
# PURPOSE:
#   Defines all hosts and logical groupings for VM provisioning automation.
#
# STRUCTURE:
#   - Zone groups contain network/domain groups
#   - Network/domain groups contain OS-specific groups
#   - OS groups contain actual hosts with connection settings
#
# ===================================================================================

# -------------------------------------------------------------------------
# ZONE: xxxxxx HQ
# -------------------------------------------------------------------------
[zone_xxxxxx_hq:children]
xxxxxxxxxxxx11_green
# xxxxxxxxxxx02_orgengr   # Uncomment when OrgEngr hosts are active

# -------------------------------------------------------------------------
# ZONE: xxxxxx VA
# -------------------------------------------------------------------------
[zone_xxxxxx_va:children]
# xxxxxxxxxxx01_green     # Uncomment when VA hosts are active

# -------------------------------------------------------------------------
# NETWORK: xxxxxxxxxxx02 – OrgEngr (HQ)
# -------------------------------------------------------------------------
[xxxxxxxxxxx02_orgengr:children]
xxxxxxxxxxx02_orgengr_linux
xxxxxxxxxxx02_orgengr_windows

[xxxxxxxxxxx02_orgengr_linux]
# Example:
# xxxxxxxxxxx01 ansible_host=xx.xx.xxx.xx ansible_user=root
# Add HQ OrgEngr Linux hosts here

[xxxxxxxxxxx02_orgengr_windows]
# Example:
# xxxxxxxxxxx01 ansible_host=xx.xx.xxx.xx ansible_user=Administrator
# Add HQ OrgEngr Windows hosts here

# -------------------------------------------------------------------------
# NETWORK: xxxxxxxxxxx11 – Green (HQ)
# -------------------------------------------------------------------------
[xxxxxxxxxxx11_green:children]
xxxxxxxxxxx11_green_linux
xxxxxxxxxxx11_green_windows

[xxxxxxxxxxx11_green_linux]
xxxxxxxxxxx03 ansible_host=xx.xx.xxx.xx ansible_user=root
# Add additional HQ Green Linux hosts here

[xxxxxxxxxxx11_green_windows]
# Add HQ Green Windows hosts here

# -------------------------------------------------------------------------
# NETWORK: xxxxxxxxxxx01 – Green (VA)
# -------------------------------------------------------------------------
[xxxxxxxxxxx01_green:children]
xxxxxxxxxxx01_green_linux
xxxxxxxxxxx01_green_windows

[xxxxxxxxxx01_green_linux]
# xxxxxxxxxxx01 ansible_host=xx.xx.xxx.xx ansible_user=root
# xxxxxxxxxxx02 ansible_host=xx.xx.xxx.x ansible_user=root
# xxxxxxxxxxx03 ansible_host=xx.xx.xxx.x ansible_user=root

[xxxxxxxxxxx01_green_windows]
# Add VA Green Windows hosts here

# -------------------------------------------------------------------------
# RUNNER GROUP
# -------------------------------------------------------------------------
[runner]
localhost ansible_connection=local ansible_python_interpreter=/usr/bin/python3

# -------------------------------------------------------------------------
# ALL SERVERS GROUP
# -------------------------------------------------------------------------
[all_servers:children]
zone_xxxxxxx_hq
zone_xxxxxx_va